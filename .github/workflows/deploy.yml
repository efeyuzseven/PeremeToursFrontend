name: Deploy frontend to pereme.com.tr

on:
  push:
    branches: [main-prod]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: peremetours-frontend
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::890571110014:role/peremetours-frontend-github-deploy
  BUCKET_NAME: peremetours-test-890571110014-eu-central-1
  DISTRIBUTION_ID: E2CWRTSM9C24S6
  # Public reCAPTCHA v2 site key for pereme.com.tr; the matching secret lives in /peremetours/test/ZIRAAT_POS.
  VITE_RECAPTCHA_SITE_KEY: 6LciO_UtAAAAAIZYhH43uUmNyGAciKvGjVMPmI_E

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Static HTML of each public page for crawlers that do not run JavaScript (scripts/prerender.mjs).
      # Never blocks a deploy: a page without a prerender is served the plain SPA shell, as before.
      - name: Prerender pages
        id: prerender
        continue-on-error: true
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run prerender

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same steps as scripts/deploy-test.ps1: hashed assets first, then the pages that reference them.
      # The shell goes to index.html (replaced below by the homepage prerender) and to spa.html, the page
      # CloudFront should return for addresses without an object (see infra/README.md).
      - name: Upload to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/assets "s3://$BUCKET_NAME/assets" --cache-control 'public,max-age=31536000,immutable'
          for key in index.html spa.html; do
            aws s3 cp dist/index.html "s3://$BUCKET_NAME/$key" \
              --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,no-store,must-revalidate'
          done
          aws s3 cp dist/favicon.svg "s3://$BUCKET_NAME/favicon.svg" \
            --content-type 'image/svg+xml' --cache-control 'public,max-age=86400'
          aws s3 cp dist/robots.txt "s3://$BUCKET_NAME/robots.txt" \
            --content-type 'text/plain; charset=utf-8' --cache-control 'public,max-age=3600'

      # Each prerendered page is stored at its address without an extension (key "turlar/sunset" serves
      # /turlar/sunset), so CloudFront needs no extra rule. prerender-manifest.json lists the keys in use.
      - name: Upload prerendered pages
        shell: bash
        run: |
          set -euo pipefail
          manifest=dist/prerendered/manifest.json
          if [ "${{ steps.prerender.outcome }}" != success ] || [ ! -f "$manifest" ]; then
            echo "::warning::Prerendering failed; every page is served the plain SPA shell this time."
            mkdir -p dist/prerendered && echo '{"pages":[]}' > "$manifest"
          fi
          jq -r '.pages[] | [.file, .key] | @tsv' "$manifest" | while IFS=$'\t' read -r file key; do
            aws s3 cp "dist/prerendered/$file" "s3://$BUCKET_NAME/$key" --only-show-errors \
              --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,no-store,must-revalidate'
          done
          # Pages prerendered last time but not now would still load the previous bundle: remove them, or, if the
          # role may not delete, replace them with the current shell. The previous list is read through the site,
          # which needs no S3 read permission (before the first such deploy that returns the shell, not JSON).
          curl -fsS https://pereme.com.tr/prerender-manifest.json -o previous-manifest.json || echo '{}' > previous-manifest.json
          { jq -r '.pages[]?.key' previous-manifest.json 2>/dev/null || true; } | sort > previous-keys
          jq -r '.pages[].key' "$manifest" | sort > current-keys
          comm -23 previous-keys current-keys | while read -r key; do
            if [ "$key" = index.html ]; then continue; fi # already the shell, from the step above
            echo "Removing stale prerendered page $key"
            aws s3 rm "s3://$BUCKET_NAME/$key" --only-show-errors \
              || aws s3 cp dist/index.html "s3://$BUCKET_NAME/$key" --only-show-errors \
                --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,no-store,must-revalidate'
          done
          jq '{generatedAtUtc, pages: [.pages[] | {path, key}]}' "$manifest" > published-manifest.json
          aws s3 cp published-manifest.json "s3://$BUCKET_NAME/prerender-manifest.json" --only-show-errors \
            --content-type 'application/json' --cache-control 'no-cache,no-store,must-revalidate'

      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$INVALIDATION_ID"

      - name: Verify site
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --output /dev/null https://pereme.com.tr/
